name: handoff-repair-20261019
on:
  push:
    branches: [fix/handoff-context-working-memory-20261019]
    paths: [scripts/maintenance/apply-handoff-repair-20261019.mjs, scripts/maintenance/handoff-repair-payload-20261019.b64]
permissions:
  contents: write
concurrency:
  group: handoff-repair-20261019
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'chx6418-source/whalebridge' && github.ref == 'refs/heads/fix/handoff-context-working-memory-20261019'
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      WHALEBRIDGE_TEST_NETWORK: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked project dependencies
        run: npm ci
      - name: Apply exact-base repair and verify red-green on repair branch only
        run: node scripts/maintenance/apply-handoff-repair-20261019.mjs
