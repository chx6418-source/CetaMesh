name: ci
on:
  push:
    branches: ['**']
    paths-ignore: ['apps/mobile/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths-ignore: ['apps/mobile/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:
    inputs:
      build_candidate:
        description: Build an internal Windows candidate (public release remains HOLD)
        type: boolean
        default: false
      channel:
        description: Candidate channel
        type: choice
        options: [dev, rc]
        default: dev
permissions:
  contents: read
jobs:
  test:
    name: test (windows, node 22, rust stable)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WHALEBRIDGE_TEST_NETWORK: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-shell
      - run: npm ci
      - run: npm --prefix desktop-ui ci
      - run: npm run build:ui
      - name: Unified test suite
        run: |
          npm test 2>&1 | Tee-Object -FilePath ci-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust checks and tests through unified runner
        env:
          WHALEBRIDGE_TEST_CARGO: '1'
        run: npm test -- --suite cargo:check --suite cargo:test
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cetamesh-test-windows-${{ github.sha }}
          path: ci-test.log
          if-no-files-found: error
          retention-days: 14
  release-build:
    name: internal CetaMesh candidate (manual)
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_candidate && github.event.repository.private
    timeout-minutes: 90
    env:
      CANDIDATE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-shell
      - run: npm ci
      - run: npm --prefix desktop-ui ci
      - run: npm run build:ui
      - name: Build Core SEA
        run: npm run build:core
      - name: Build Desktop Shell
        run: npm run desktop:build
      - name: Candidate metadata
        id: candidate
        run: node scripts/ci-candidate.mjs --channel "$env:CANDIDATE_CHANNEL"
      - name: Assemble internal candidate
        run: |
          if ($env:CANDIDATE_CHANNEL -eq 'dev') { npm run build:release -- --dev --use-current-build-number }
          else { npm run build:release -- --use-current-build-number }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify candidate without executing product binaries
        run: node scripts/ci-candidate.mjs --verify --channel "$env:CANDIDATE_CHANNEL"
      - name: Upload internal candidate (RELEASE HOLD)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.artifactName }}
          path: |
            ${{ steps.candidate.outputs.directory }}/${{ steps.candidate.outputs.setup }}
            ${{ steps.candidate.outputs.directory }}/release-manifest.json
            ${{ steps.candidate.outputs.directory }}/SHA256SUMS.txt
            ${{ steps.candidate.outputs.directory }}/sbom.json
            ${{ steps.candidate.outputs.directory }}/licenses/**
          if-no-files-found: error
          retention-days: 14
