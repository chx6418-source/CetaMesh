name: iOS Ruby dependencies

on:
  push:
    branches: ['**']
    paths:
      - 'apps/mobile/Gemfile'
      - 'apps/mobile/scripts/check-ios-ruby-dependencies.rb'
      - '.github/workflows/ios-dependencies.yml'
  pull_request:
    paths:
      - 'apps/mobile/Gemfile'
      - 'apps/mobile/scripts/check-ios-ruby-dependencies.rb'
      - '.github/workflows/ios-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  dependencies:
    name: Resolve and exercise CocoaPods Ruby dependencies
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1, verified 2026-11-15
        with:
          ruby-version: '3.3'
          bundler: '2.6.9'
      - name: Resolve and install the declared Gemfile
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 2
          bundle check
      - name: Load CocoaPods CLI
        run: bundle exec pod --version
      - name: Exercise patched dependency behavior
        run: bundle exec ruby scripts/check-ios-ruby-dependencies.rb
