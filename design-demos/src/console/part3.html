<script>
(function () {
  'use strict';

  /* ================= 基础工具 ================= */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // 通过 ?token= 进入（控制台启用鉴权时根路径会重定向带 token），存到 localStorage
  (() => {
    const qs = new URLSearchParams(location.search);
    const token = qs.get('token');
    if (token) {
      localStorage.setItem('consoleToken', token);
      history.replaceState({}, '', location.pathname);
    }
  })();

  /* ================= Toast（代替 alert） ================= */
  function toast(msg, opts) {
    opts = opts || {};
    const box = $('#toasts');
    const t = document.createElement('div');
    t.className = 'toast ' + (opts.type || '');
    t.innerHTML = '<span>' + msg + '</span>';
    box.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, opts.ms || 3400);
    while (box.children.length > 4) box.firstChild.remove();
  }

  /* ================= 空输出框自动隐藏（不占版面） ================= */
  function syncAutoShow() {
    $$('.auto-show').forEach(el => {
      const t = el.textContent.trim();
      el.hidden = (t === '' || t === '（空）' || t === '（全部会话状态：空）');
    });
  }

  /* ================= 防误触：连点两次确认（代替 confirm 弹窗，用于静态按钮） ================= */
  function bindArm(btn) {
    if (!btn || btn.dataset.armBound) return;
    btn.dataset.armBound = '1';
    let timer = null;
    btn.addEventListener('click', () => {
      if (btn.classList.contains('armed')) {
        clearTimeout(timer);
        btn.classList.remove('armed');
        btn.textContent = btn.dataset.orig;
        btn.dispatchEvent(new CustomEvent('confirmed'));
      } else {
        btn.dataset.orig = btn.textContent;
        btn.classList.add('armed');
        btn.textContent = btn.dataset.arm || '再点一次确认';
        timer = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = btn.dataset.orig; }, 2800);
      }
    });
  }
  $$('[data-arm]').forEach(bindArm);

  /* ================= 通用确认弹窗（动态列表操作用） ================= */
  function confirmBox(text, okLabel) {
    return new Promise((resolve) => {
      const overlay = $('#confirmOverlay'), ok = $('#confirmOk'), cancel = $('#confirmCancel');
      $('#confirmText').textContent = text || '确定执行该操作？';
      ok.textContent = okLabel || '确认';
      overlay.classList.add('open');
      const done = (v) => {
        overlay.classList.remove('open');
        ok.removeEventListener('click', onOk);
        cancel.removeEventListener('click', onCancel);
        overlay.removeEventListener('click', onOutside);
        resolve(v);
      };
      function onOk() { done(true); }
      function onCancel() { done(false); }
      function onOutside(e) { if (e.target === overlay) done(false); }
      ok.addEventListener('click', onOk);
      cancel.addEventListener('click', onCancel);
      overlay.addEventListener('click', onOutside);
    });
  }

  /* ================= 输入弹窗（代替 prompt，用于记忆编辑） ================= */
  function promptModal(title, value) {
    return new Promise((resolve) => {
      const overlay = $('#memEditOverlay'), input = $('#memEditInput'), ok = $('#memEditSave'), cancel = $('#memEditCancel');
      $('#memEditTitle').textContent = title || '编辑';
      input.value = value || '';
      overlay.classList.add('open');
      setTimeout(() => { input.focus(); input.select(); }, 60);
      const done = (v) => {
        overlay.classList.remove('open');
        ok.removeEventListener('click', onOk);
        cancel.removeEventListener('click', onCancel);
        overlay.removeEventListener('click', onOutside);
        input.removeEventListener('keydown', onKey);
        resolve(v);
      };
      function onOk() { done(input.value); }
      function onCancel() { done(null); }
      function onOutside(e) { if (e.target === overlay) done(null); }
      function onKey(e) { if (e.key === 'Enter') onOk(); }
      ok.addEventListener('click', onOk);
      cancel.addEventListener('click', onCancel);
      overlay.addEventListener('click', onOutside);
      input.addEventListener('keydown', onKey);
    });
  }

  /* ================= 鉴权（401 时弹出，代替 prompt 循环） ================= */
  let authPromise = null;
  function requestToken() {
    if (authPromise) return authPromise;
    authPromise = new Promise((resolve) => {
      const overlay = $('#authOverlay'), input = $('#authTokenInput'), ok = $('#authOk'), msg = $('#authMsg');
      msg.textContent = '';
      input.value = '';
      overlay.classList.add('open');
      setTimeout(() => input.focus(), 60);
      const done = (v) => {
        overlay.classList.remove('open');
        authPromise = null;
        ok.removeEventListener('click', onOk);
        input.removeEventListener('keydown', onKey);
        resolve(v);
      };
      function onOk() {
        const v = input.value.trim();
        if (!v) { msg.textContent = '请输入令牌'; return; }
        done(v);
      }
      function onKey(e) { if (e.key === 'Enter') onOk(); }
      ok.addEventListener('click', onOk);
      input.addEventListener('keydown', onKey);
    });
    return authPromise;
  }

  /* ================= API（沿用原鉴权协议：x-console-token） ================= */
  async function api(path, method, body, _retried = 0) {
    const headers = body ? { 'content-type': 'application/json' } : {};
    const token = localStorage.getItem('consoleToken');
    if (token) headers['x-console-token'] = token;
    const res = await fetch(path, { method: method || 'GET', headers, body: body ? JSON.stringify(body) : undefined });
    if (res.status === 401) {
      if (_retried >= 2) throw new Error('未授权');
      const t = await requestToken();
      if (!t) throw new Error('未授权');
      localStorage.setItem('consoleToken', t);
      return api(path, method, body, _retried + 1);
    }
    return res.json();
  }

  /* ================= 模块导航 ================= */  /* ================= 模块导航 ================= */
  function go(module, silent) {
    $$('.module').forEach(m => { m.hidden = m.dataset.module !== module; });
    $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.module === module));
    if (!silent) { try { history.replaceState(null, '', '#' + module); } catch (e) {} }
    window.scrollTo({ top: 0, behavior: silent ? 'auto' : 'smooth' });
  }
  $$('.nav-btn').forEach(b => b.addEventListener('click', () => go(b.dataset.module)));
  const hash = (location.hash || '').replace('#', '');
  go(['models', 'agents', 'logs', 'settings'].indexOf(hash) >= 0 ? hash : 'models', true);

  /* ================= 主题切换（苏打 / 深海 / 护眼） ================= */
  const themeBox = $('#themeSwitch');
  [
    { id: 'light', label: '苏打' },
    { id: 'dark', label: '深海' },
    { id: 'warm', label: '护眼' }
  ].forEach(t => {
    const b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.theme = t.id;
    b.addEventListener('click', () => {
      document.documentElement.classList.add('theme-anim');
      document.documentElement.dataset.theme = t.id;
      try { localStorage.setItem('consoleTheme', t.id); } catch (e) {}
      syncTheme();
      toast('主题已切换：' + t.label);
      setTimeout(() => document.documentElement.classList.remove('theme-anim'), 400);
    });
    themeBox.appendChild(b);
  });
  function syncTheme() {
    const cur = document.documentElement.dataset.theme;
    $$('button', themeBox).forEach(b => b.classList.toggle('active', b.dataset.theme === cur));
  }
  try {
    const saved = localStorage.getItem('consoleTheme');
    if (saved && ['light', 'dark', 'warm'].indexOf(saved) >= 0) document.documentElement.dataset.theme = saved;
  } catch (e) {}
  syncTheme();

  /* ================= 自定义下拉框（选项列表与主题统一） =================
     保留原生 select（隐藏），所有读取 .value / change 监听的逻辑零改动；
     触发按钮 + 玻璃糖果风弹出菜单，选择时回写 value 并派发 change。 */
  const selMenu = document.createElement('div');
  selMenu.className = 'sel-menu';
  document.body.appendChild(selMenu);
  let selMenuOwner = null, selMenuHl = -1;
  function closeSelMenu() {
    selMenu.classList.remove('open');
    if (selMenuOwner) {
      const w = selMenuOwner.closest('.sel-wrap');
      if (w) w.classList.remove('open');
    }
    selMenuOwner = null; selMenuHl = -1;
  }
  function syncSelLabel(sel) {
    const btn = sel._selBtn;
    if (!btn) return;
    const o = sel.options[sel.selectedIndex];
    const t = o ? o.textContent : '';
    if (btn._lastLabel !== t) { btn._lastLabel = t; btn.querySelector('span').textContent = t; }
  }
  function applySelValue(sel, v) {
    if (sel.value !== v) {
      sel.value = v;
      sel.dispatchEvent(new Event('change', { bubbles: true }));
    }
    syncSelLabel(sel);
  }
  function renderSelHl() {
    [...selMenu.children].forEach((el, i) => el.classList.toggle('hl', i === selMenuHl));
    const el = selMenu.children[selMenuHl];
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
  function openSelMenu(sel) {
    closeSelMenu();
    selMenuOwner = sel;
    selMenu.innerHTML = '';
    const cur = sel.value;
    [...sel.options].forEach((o) => {
      const item = document.createElement('div');
      item.className = 'sel-item' + (o.value === cur ? ' checked' : '');
      item.dataset.value = o.value;
      item.textContent = o.textContent || ' ';
      item.addEventListener('click', () => { closeSelMenu(); applySelValue(sel, o.value); });
      selMenu.appendChild(item);
    });
    selMenu.classList.add('open');
    selMenu.style.visibility = 'hidden';
    // 宽度自适应最长选项：先按 max-content 量宽，再夹在触发框宽度与视口之间
    selMenu.style.width = 'max-content';
    selMenu.style.maxWidth = (window.innerWidth - 16) + 'px';
    const wrap = sel.closest('.sel-wrap');
    if (wrap) wrap.classList.add('open');
    const r = sel._selBtn.getBoundingClientRect();
    const natural = selMenu.offsetWidth;
    const mw = Math.max(r.width, Math.min(natural, window.innerWidth - 16));
    selMenu.style.width = mw + 'px';
    selMenu.style.maxWidth = '';
    const mh = selMenu.offsetHeight;
    selMenu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - mw - 8)) + 'px';
    selMenu.style.top = (r.bottom + 6 + mh > window.innerHeight - 8 ? Math.max(8, r.top - mh - 6) : r.bottom + 6) + 'px';
    selMenu.style.visibility = '';
    const idx = [...sel.options].findIndex(o => o.value === cur);
    selMenuHl = idx >= 0 ? idx : 0;
    renderSelHl();
  }
  function chooseSelHl() {
    const sel = selMenuOwner;
    if (!sel || !selMenu.children[selMenuHl]) return;
    const v = selMenu.children[selMenuHl].dataset.value;
    closeSelMenu();
    applySelValue(sel, v);
  }
  function beautifySelect(sel) {
    if (sel.dataset.beautyBound) return;
    sel.dataset.beautyBound = '1';
    const wrap = document.createElement('div');
    wrap.className = 'sel-wrap';
    wrap.setAttribute('style', sel.getAttribute('style') || '');
    sel.removeAttribute('style');
    sel.classList.add('sel-native');
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sel-trigger';
    btn.innerHTML = '<span></span>';
    wrap.appendChild(btn);
    sel._selBtn = btn;
    syncSelLabel(sel);
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (selMenuOwner === sel) closeSelMenu(); else openSelMenu(sel);
    });
    btn.addEventListener('keydown', (e) => {
      if (selMenuOwner === sel) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const n = sel.options.length;
          selMenuHl = (selMenuHl + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
          renderSelHl();
        } else if (e.key === 'Enter') { e.preventDefault(); chooseSelHl(); }
        else if (e.key === 'Escape') closeSelMenu();
      } else if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault(); openSelMenu(sel);
      }
    });
  }
  document.addEventListener('click', (e) => {
    if (!selMenuOwner) return;
    if (selMenu.contains(e.target) || (selMenuOwner._selBtn && selMenuOwner._selBtn.contains(e.target))) return;
    closeSelMenu();
  });
  window.addEventListener('scroll', (e) => { if (e.target !== selMenu) closeSelMenu(); }, true);
  window.addEventListener('resize', closeSelMenu);
  $$('select').forEach(beautifySelect);
  // 值被轮询等程序修改时，同步触发按钮上的显示
  setInterval(() => { $$('select[data-beauty-bound]').forEach(syncSelLabel); }, 400);

  /* ================= 模型配置 ================= */
  const M = window.MOCK;
  var modelList = $('#modelList');
  M.models.forEach(function (m) {
    var item = document.createElement('label');
    item.className = 'model-item' + (m.tag === '当前' ? ' checked' : '');
    item.innerHTML = '<input type="radio" name="model" value="' + m.id + '"' + (m.tag === '当前' ? ' checked' : '') + '>' +
      '<span class="radio"></span><div><b>' + m.id + '</b><small>' + m.desc + '</small></div>' +
      (m.tag ? '<span class="pill' + (m.tag === '当前' ? ' pill-accent' : '') + '">' + m.tag + '</span>' : '');
    item.querySelector('input').addEventListener('change', function () {
      $$('.model-item', modelList).forEach(function (x) { x.classList.remove('checked'); });
      item.classList.add('checked');
      toast('模型已切换为 <b>' + m.id + '</b>，对新回合生效');
    });
    modelList.appendChild(item);
  });
  $$('#effortSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      $$('#effortSeg button').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      toast('推理强度 → ' + b.textContent);
    });
  });
  $('#dshCheck').addEventListener('click', function () {
    var pill = $('#dshState');
    pill.className = 'pill pill-warn'; pill.innerHTML = '<span class="dot pulse"></span>检测中…';
    setTimeout(function () {
      pill.className = 'pill pill-ok'; pill.innerHTML = '<span class="dot pulse"></span>在线 · 42ms';
      toast('DSH 连通正常 · 42ms');
    }, 700);
  });
  var bindBox = $('#modeBind');
  function renderBind() {
    bindBox.innerHTML = '';
    M.modes.forEach(function (md) {
      var opts = M.presets.map(function (p) {
        return '<option value="' + p.id + '"' + (p.id === md.preset ? ' selected' : '') + '>' + p.id + '</option>';
      }).join('');
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<b class="mono" style="min-width:96px">' + md.id + '</b>' +
        '<small style="flex:1;min-width:150px">' + md.desc + '</small>' +
        '<select data-mode="' + md.id + '">' + opts + '</select>' +
        '<span class="pill">' + md.scene + '</span>';
      row.querySelector('select').addEventListener('change', function (e) {
        md.preset = e.target.value;
        toast('<b>' + md.id + '</b> 的预设已改为 <b>' + e.target.value + '</b>，即时生效');
      });
      bindBox.appendChild(row);
    });
  }
  renderBind(); renderPresets();
  $('#sendDelay').addEventListener('input', function () { $('#sendDelayOut').textContent = this.value + 'ms'; });
  $('#sendDelay').addEventListener('change', function () { toast('发送间隔 → ' + this.value + 'ms'); });
  $('#ackMessage').addEventListener('change', function () { toast(this.value ? '投递回执已开启' : '投递回执已关闭'); });
  $('#splitSend').addEventListener('change', function () { toast('分句发送：' + (this.checked ? '开' : '关')); });

  /* ================= 状态轮询（核心刷新） ================= */
  const MODE_LABEL = { chat: '聊天模式', 'closed-agent': '封闭 Agent', reserved: '一代仿真', reserved2: '二代仿真' };
  async function refresh() {
    try {
      const s = await api('/api/status');
      $$('#modeRow .mode-tile').forEach(b => b.classList.toggle('active', b.dataset.mode === s.mode));
      const modeLabel = MODE_LABEL[s.mode] || s.mode;
      const dshPill = $('#pillDsh');
      dshPill.className = 'pill ' + (s.dshReady ? 'pill-ok' : 'pill-err');
      dshPill.innerHTML = '<span class="dot' + (s.dshReady ? ' pulse' : '') + '"></span>DSH ' + (s.dshReady ? '在线' : '离线');
      $('#pillMode').textContent = modeLabel;
      const silentPill = $('#pillSilent');
      silentPill.className = 'pill ' + (s.roleMode === 'silent' ? 'pill-warn' : '');
      silentPill.textContent = s.roleMode === 'silent' ? '静默中' : '正常';
      $('#pillOwner').textContent = 'Owner ' + (s.ownerQQ || '未设置');
      $('#statusText').textContent = modeLabel + ' · 角色: ' + (s.role || '无');
      $('#dshReadyText').innerHTML = (s.dshReady ? '<span class="ok-text">在线</span>' : '<span class="err-text">离线</span>') + ' · 模式 ' + esc(modeLabel);
      $('#ownerStatusText').textContent = s.ownerQQ || '未设置（fail-closed）';
      $('#groupsStatusText').textContent = (s.allowGroups || []).join(', ') || '无';
      $('#privateStatusText').textContent = (s.allowPrivate || []).join(', ') || '无';
      $('#roleText').textContent = '当前：' + (s.role || '无');
      $('#roleModeText').textContent = s.roleMode === 'silent' ? '静默' : '正常';
      $('#silentSwitch').checked = s.roleMode === 'silent';
      $('#activity').textContent = s.activity || '（空）';
      const presetSel = $('#closedPreset');
      if (presetSel && document.activeElement !== presetSel) {
        const want = s.closedAgentPreset || '';
        // 当前配置的预设不在 DSH 列表里时，动态补一项，避免下拉框显示空白
        if (want && ![...presetSel.options].some(o => o.value === want)) {
          const opt = document.createElement('option');
          opt.value = want;
          opt.textContent = want + '（当前配置）';
          presetSel.insertBefore(opt, presetSel.options[1] || null);
        }
        presetSel.value = [...presetSel.options].some(o => o.value === want) ? want : '';
      }
    } catch (e) {
      const dshPill = $('#pillDsh');
      dshPill.className = 'pill pill-err';
      dshPill.textContent = '桥接连接失败';
      $('#statusText').textContent = '连接失败';
    }
  }

  async function refreshPresets() {
    try {
      const r = await api('/api/presets');
      const sel = $('#closedPreset');
      const prev = sel.value;
      sel.innerHTML = '';
      const ph = document.createElement('option');
      ph.value = '';
      ph.textContent = '未设置（closed-agent 默认 router-standard）';
      sel.appendChild(ph);
      for (const p of (r.presets || [])) {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.id + (p.trust === 'user' ? '（用户）' : '');
        sel.appendChild(opt);
      }
      if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
      refresh();
    } catch (e) {}
  }

  async function saveMode(mode) {
    const preset = $('#closedPreset').value || 'router-standard';
    const r = await api('/api/mode', 'POST', { mode, closedAgentPreset: preset });
    if (r.ok) { refresh(); toast('运行模式 → <b>' + esc(MODE_LABEL[mode] || mode) + '</b>，桥接 5 秒内感知'); }
    else toast('❌ ' + esc(r.error || '切换失败'), { type: 'err' });
    return r;
  }
  $$('#modeRow .mode-tile').forEach(b => b.addEventListener('click', async () => {
    if (b.classList.contains('active')) return;
    await saveMode(b.dataset.mode);
  }));
  $('#closedPreset').addEventListener('change', async () => {
    const active = $('#modeRow .mode-tile.active');
    const mode = active ? active.dataset.mode : 'chat';
    await saveMode(mode);
  });

  /* ================= Agent 预设库（只读展示） ================= */
  function renderPresets() {
    const box = $('#presetRows');
    if (!box) return;
    box.innerHTML = '';
    M.presets.forEach(function (p) {
      const used = M.modes.some(function (md) { return md.preset === p.id; });
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<div class="grow"><b class="mono">' + p.name + '</b><small>' + p.desc + '</small></div>' +
        '<span class="pill">' + p.model + '</span><span class="pill">' + p.tools + ' 个工具</span>' +
        (used ? '<span class="pill pill-accent">使用中</span>' : '<span class="pill">未挂载</span>');
      box.appendChild(row);
    });
  }

  /* ================= 角色 / 静默 ================= */
  async function refreshRoles() {
    try {
      const r = await api('/api/roles');
      const box = $('#roleList');
      box.innerHTML = '';
      if (!(r.roles || []).length) { box.innerHTML = '<span class="meta">暂无角色，可在下方新建</span>'; return; }
      for (const name of r.roles) {
        const tag = document.createElement('button');
        tag.type = 'button';
        tag.className = 'chip' + (name === r.current ? ' active' : '');
        tag.textContent = name;
        tag.addEventListener('click', async () => {
          const res = await api('/api/role', 'POST', { role: name });
          if (!res.ok) toast('❌ ' + esc(res.error || '切换失败'), { type: 'err' });
          else toast('角色已切换为 <b>' + esc(name) + '</b>');
          refreshRoles(); refresh();
        });
        box.appendChild(tag);
      }
    } catch (e) { $('#roleList').innerHTML = '<span class="meta">加载失败</span>'; }
  }
  $('#roleSet').addEventListener('click', async () => {
    const name = $('#roleInput').value.trim();
    if (!name) { toast('请输入角色名，或直接点击上方角色', { type: 'warn' }); return; }
    const r = await api('/api/role', 'POST', { role: name });
    if (r.ok) { toast('角色已设置为 <b>' + esc(name) + '</b>'); $('#roleInput').value = ''; }
    else toast('❌ ' + esc(r.error || '设置失败'), { type: 'err' });
    refreshRoles(); refresh();
  });
  $('#roleClear').addEventListener('click', async () => {
    await api('/api/role', 'POST', { role: null });
    toast('已清除角色扮演');
    refreshRoles(); refresh();
  });
  $('#roleCreate').addEventListener('click', async () => {
    const name = $('#newRoleName').value.trim();
    const content = $('#newRoleContent').value.trim();
    if (!name) { toast('请填写角色名', { type: 'warn' }); return; }
    const r = await api('/api/roles/create', 'POST', { name, content });
    const msg = $('#roleCreateMsg');
    msg.textContent = r.ok ? '✅ 已创建' : ('❌ ' + (r.error || '失败'));
    msg.className = r.ok ? 'meta ok' : 'meta err';
    if (r.ok) {

  async function refreshSessions() {
    try {
      const s = await api('/api/sessions');
      const box = $('#sessionList');
      if (!s.sessions.length) { box.innerHTML = '<div class="empty-tip">暂无会话</div>'; return; }
      let html = '<table class="tbl"><tr><th>QQ 会话</th><th>DSH 会话 ID</th><th>类型</th><th></th></tr>';
      for (const x of s.sessions) {
        const isP = x.key.startsWith('private:');
        const type = isP ? '<span class="pill pill-accent">私聊</span>' : '<span class="pill pill-ok">群</span>';
        const ownerTag = x.owner ? ' <span class="pill pill-warn">管理员</span>' : '';
        html += '<tr><td>' + esc(x.key) + ownerTag + '</td><td><code>' + esc(x.sessionId) + '</code></td><td>' + type + '</td><td><button class="btn sm" data-reset-key="' + esc(x.key) + '">清除上下文</button></td></tr>';
      }
      box.innerHTML = html + '</table>';
      box.querySelectorAll('[data-reset-key]').forEach(btn => btn.addEventListener('click', async () => {
        if (!await confirmBox('确定清除该会话的上下文？下次消息将开新会话。')) return;
        const r = await api('/api/session/reset', 'POST', { key: btn.dataset.resetKey });
        toast(r.ok ? '✅ 已清除上下文' : ('❌ ' + esc(r.error || '失败')), { type: r.ok ? 'ok' : 'err' });
        refreshSessions();
      }));
    } catch (e) {}
  }

  async function refreshPending() {
    try {
      const p = await api('/api/pending');
      const box = $('#pendingList');
      if (!p.pending.length) { box.innerHTML = '<div class="empty-tip">无挂起请求 ✨</div>'; return; }
      let html = '<div class="list-rows">';
      for (const x of p.pending) {
        const kind = x.kind === 'approval' ? '<span class="pill pill-err">审批</span>' : '<span class="pill pill-accent">提问</span>';
        let detail = '';
        if (x.kind === 'approval') detail = esc(x.toolName) + (x.reason ? '：' + esc(x.reason) : '');
        else if (x.questions) detail = x.questions.map(q => esc(q.question)).join(' / ');
        html += '<div class="list-row"><code>' + esc(x.key) + '</code>' + kind + '<div class="grow"><small>' + detail + '</small></div></div>';
      }
      box.innerHTML = html + '</div>';
    } catch (e) {}
  }

  async function loadV2SessionOptions() {
    const sel = $('#v2SessionSelect');
    const prev = sel.value;
    try {
      const r = await api('/api/status');
      const groups = Array.isArray(r.allowGroups) ? r.allowGroups : [];
      const privates = Array.isArray(r.allowPrivate) ? r.allowPrivate : [];
      const options = [{ value: '', label: '选择白名单群/私聊…' }];
      for (const g of groups) options.push({ value: 'group:' + g, label: '群 ' + g });
      for (const p of privates) options.push({ value: 'private:' + p, label: '私聊 ' + p });
      sel.innerHTML = options.map(o => '<option value="' + esc(o.value) + '">' + esc(o.label) + '</option>').join('');
      if (prev && options.some(o => o.value === prev)) sel.value = prev;
    } catch (e) {
      sel.innerHTML = '<option value="">无法加载白名单</option>';
    }
  }

  function v2ToolLogStatus(entry) {
    if (entry.type === 'result') {
      const ok = entry.ok !== false;
      return '<span class="pill ' + (ok ? 'pill-ok' : 'pill-err') + '">' + (ok ? '成功' : '失败') + '</span>';
    }
    return '<span class="pill pill-accent">调用</span>';
  }
  function summarizeToolArgs(tool, args) {
    let obj = args;
    if (typeof args === 'string') {
      try { obj = JSON.parse(args); } catch (e) { return args || ''; }
    }
    if (!obj || typeof obj !== 'object') return String(obj ?? '');
    const parts = [];
    const push = (k, v) => { if (v === undefined || v === null || v === '') return; parts.push(k + '=' + v); };
    const t = String(tool || '');
    if (t.includes('qq_set_wake_config')) {
      const cfg = (obj.config && typeof obj.config === 'object') ? obj.config : obj;
      push('mode', cfg.mode);
      push('infinite', cfg.infinite);
      const sleepUntil = cfg.sleepUntil || obj.sleepUntil;
      const sleepMs = cfg.sleepMs !== undefined ? cfg.sleepMs : obj.sleepMs;
      if (sleepUntil) push('sleepUntil', sleepUntil);
      else if (sleepMs !== undefined) push('sleepMs', sleepMs + 'ms');
      else push('sleep', '未设置时间');
      const tr = (cfg.triggers && typeof cfg.triggers === 'object') ? cfg.triggers : {};
      const trigs = [];
      if (tr.atMention) trigs.push('@');
      if (tr.nameMention) trigs.push('名字');
      if (tr.question) trigs.push('提问');
      if (tr.poke) trigs.push('拍一拍');
      if (Array.isArray(tr.keywords) && tr.keywords.length) trigs.push('关键词:' + tr.keywords.join(','));
      if (Array.isArray(tr.speakerIds) && tr.speakerIds.length) trigs.push('指定成员:' + tr.speakerIds.join(','));
      if (tr.anyMessage) trigs.push('anyMessage');
      if (Number(tr.probability) > 0) trigs.push('概率:' + tr.probability);
      if (trigs.length) push('triggers', trigs.join('|'));
    } else if (t.includes('qq_wait_for_messages')) {
      push('timeoutMs', obj.timeoutMs != null ? obj.timeoutMs : '默认30000');
      push('minNewMessages', obj.minNewMessages != null ? obj.minNewMessages : 1);
      push('quietMs', obj.quietMs != null ? obj.quietMs : '默认8000');
    } else if (t.includes('qq_send_message')) {
      const msgs = Array.isArray(obj.messages) ? obj.messages : (obj.messages != null ? [obj.messages] : []);
      push('条数', msgs.length);
      if (msgs.length) push('首条', String(msgs[0]).slice(0, 30));
      push('gapMode', obj.gapMode || 'auto');
      if (obj.gapMs != null) push('gapMs', obj.gapMs);
      if (Array.isArray(obj.gaps) && obj.gaps.length) push('gaps', obj.gaps.join(','));
      if (obj.replyToMessageId != null && obj.replyToMessageId !== '') push('引用id', obj.replyToMessageId);
    } else if (t.includes('qq_send_burst')) {
      const msgs = Array.isArray(obj.messages) ? obj.messages : [];
      push('条数', msgs.length);
      if (msgs.length) push('首条', String(msgs[0]).slice(0, 30));
    } else if (t.includes('qq_send_poke')) {
      push('key', obj.key);
      if (obj.targetUserId != null && obj.targetUserId !== '') push('target', obj.targetUserId);
    } else if (t.includes('qq_get_forward_msg')) {
      push('key', obj.key);
      if (obj.id != null && obj.id !== '') push('id', String(obj.id).slice(0, 40));
    } else if (t.includes('qq_mark_read')) {
      push('key', obj.key);
    } else if (t.includes('qq_get_prompt') || t.includes('qq_get_unread_messages') || t.includes('qq_get_recent_messages') || t.includes('qq_social_state') || t.includes('qq_get_my_recent_messages') || t.includes('qq_get_message_detail') || t.includes('qq_get_active_members')) {
      push('key', obj.key);
      if (obj.messageId != null) push('messageId', obj.messageId);
      if (obj.limit != null) push('limit', obj.limit);
    } else {
      push('key', obj.key);
    }
    return parts.join(' | ') || JSON.stringify(obj);
  }

  /* ================= 二代：唤醒状态详情 ================= */
  function formatWakeStatus(r) {
    if (!r || !r.ok) return '<div class="empty-tip">加载失败</div>';
    const wc = r.wakeConfig || {};
    const lines = [];
    const mode = wc.mode === 'active' ? '活跃（任何消息都会唤醒）' : (wc.mode === 'diving' ? '潜水' : (wc.mode || '未知'));
    lines.push('<div class="memory-line"><b>模式：</b>' + esc(mode) + '</div>');
    lines.push('<div class="memory-line"><b>无限期：</b>' + (wc.infinite ? '是' : '否') + '</div>');
    const safety = r.wakeSafety || {};
    lines.push('<div class="memory-line"><b>唤醒保证：</b>' + (safety.guaranteed ? '<span class="pill pill-ok">已保证</span>' : '<span class="pill pill-err">无保证</span>') + (safety.stale ? '（配置较旧，未确认）' : '') + '</div>');
    let next = '';
    if (wc.mode === 'active' || wc.triggers?.anyMessage) {
      next = '任何新消息都会唤醒';
    } else if (wc.sleepUntil) {
      const until = new Date(wc.sleepUntil).getTime();
      const remain = until - Date.now();
      if (!Number.isFinite(remain)) next = '时间格式无效';
      else if (remain > 0) next = '约 ' + Math.max(1, Math.round(remain / 1000)) + ' 秒后（' + new Date(wc.sleepUntil).toLocaleString() + '）';
      else next = '已到期，等待下一次唤醒';
    } else if (wc.infinite) {
      next = '无限期潜水，等待指定条件';
    } else {
      next = '未设置时间';
    }
    lines.push('<div class="memory-line"><b>下次唤醒：</b>' + esc(next) + '</div>');
    const tr = wc.triggers || {};
    const conds = [];
    if (tr.atMention) conds.push('@');
    if (tr.nameMention) conds.push('名字');
    if (Array.isArray(tr.keywords) && tr.keywords.length) conds.push('关键词：' + tr.keywords.join('、'));
    if (Array.isArray(tr.speakerIds) && tr.speakerIds.length) conds.push('指定成员：' + tr.speakerIds.join('、'));
    if (tr.question) conds.push('提问');
    if (tr.poke) conds.push('拍一拍');
    if (tr.anyMessage) conds.push('任何消息');
    if (Number(tr.probability) > 0) conds.push('普通消息概率 ' + Number(tr.probability));
    lines.push('<div class="memory-line"><b>提前唤醒条件：</b>' + (conds.length ? esc(conds.join('；')) : '（无）') + '</div>');
    lines.push('<div class="memory-line"><b>最近唤醒原因：</b>' + esc(r.lastWakeReason || '-') + '</div>');
    lines.push('<div class="memory-line"><b>唤醒次数：</b>' + (Number(wc.wakeCount) || 0) + '</div>');
    if (wc.confirmedAt) {
      const ago = Math.max(0, Math.round((Date.now() - wc.confirmedAt) / 60000));
      lines.push('<div class="memory-line"><b>配置确认：</b>' + ago + ' 分钟前（' + esc(wc.confirmedBy || 'unknown') + '）</div>');
    }
    if (r.lastAiReplyAt) {
      const ago = Math.max(0, Math.round((Date.now() - r.lastAiReplyAt) / 60000));
      lines.push('<div class="memory-line"><b>上次发言：</b>' + ago + ' 分钟前</div>');
    }
    lines.push('<div class="memory-line"><b>未读：</b>' + (Number(r.unreadCount) || 0) + ' 条</div>');
    return '<div style="padding:10px 12px">' + lines.join('') + '</div>';
  }

  $('#sStateIdle').addEventListener('click', () => setSocialPhase('idle'));

  /* ================= 黑话库 ================= */
  let slangEntriesCache = [];
  let slangSelected = new Set();
  let slangActiveTab = 'candidate';
  let slangModalId = null;
  let slangModalMode = 'confirm';

  function slangStatusLabel(status) {
    return { candidate: '候选', confirmed: '已确认', rejected: '已拒绝' }[status] || esc(status);
  }
  function slangStatusClass(status) {
    return { candidate: 'pill pill-accent', confirmed: 'pill pill-ok', rejected: 'pill pill-err' }[status] || 'pill';
  }
  function slangSourceLabel(e) {
    if (e.source === 'manual') return '手动';
    if (Array.isArray(e.evidence) && e.evidence.some(ev => ev.sender === 'AI提交')) return 'AI提交';
    return '自动提取';
  }
  function slangEvidenceHtml(e) {
    return Array.isArray(e.evidence) && e.evidence.length
      ? e.evidence.slice(-2).map(ev => '<span class="meta">' + esc(String(ev.sender || '未知')) + '：' + esc(String(ev.text || '').slice(0, 30)) + '</span>').join('<br>')
      : '<span class="meta">—</span>';
  }
  function slangSourcesHtml(e) {
    return Array.isArray(e.sources) && e.sources.length
      ? e.sources.slice(0, 5).map(s => '<span class="meta">🔗 ' + esc(s) + '</span>').join('<br>')
      : '';
  }
  function slangSearchFields(e) {
    return [e.content, e.meaning, e.usage, e.example, e.risk, Array.isArray(e.sources) ? e.sources.join(' ') : '', Array.isArray(e.evidence) ? e.evidence.map(x => x.text || '').join(' ') : ''].join(' ').toLowerCase();
  }
  function getSlangLimit() {
    const id = slangActiveTab === 'candidate' ? 'slangLimitCand' : slangActiveTab === 'confirmed' ? 'slangLimitConfirmed' : 'slangLimitRejected';
    return Math.max(10, Number($(id)?.value) || 100);
  }
  function getSlangSearch() {
    const id = slangActiveTab === 'candidate' ? 'slangSearchCand' : slangActiveTab === 'confirmed' ? 'slangSearchConfirmed' : 'slangSearchRejected';
    return String($(id)?.value || '').trim().toLowerCase();
  }
  function selectedIdsForStatus(status) {
    return [...slangSelected].filter(id => slangEntriesCache.some(e => e.id === id && e.status === status));
  }
  function setSlangMsg(text, ok) {
    const msg = $('#slangMsg');
    if (!msg) return;
    msg.textContent = text;
    msg.className = ok ? 'meta ok' : 'meta err';
  }
  function setSlangTab(tab) {
    slangActiveTab = tab;
    $$('.slang-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.slangTab === tab));
    $$('.slang-panel').forEach(panel => panel.classList.toggle('active', panel.id === 'slangPanel' + tab[0].toUpperCase() + tab.slice(1)));
    renderSlangPanel();
  }
  function updateSlangSelectAll(status) {
    const id = status === 'candidate' ? 'slangCandidateSelectAll' : status === 'confirmed' ? 'slangConfirmedSelectAll' : 'slangRejectedSelectAll';
    const el = document.getElementById(id);
    if (!el) return;
    const list = slangEntriesCache.filter(e => e.status === status);
    const q = getSlangSearch();
    const filtered = q ? list.filter(e => slangSearchFields(e).includes(q)) : list;
    el.checked = filtered.length > 0 && filtered.every(e => slangSelected.has(e.id));
    el.indeterminate = filtered.some(e => slangSelected.has(e.id)) && !el.checked;
  }

  function renderSlangPanel() {
    const status = slangActiveTab;
    const containerId = status === 'candidate' ? 'slangCandidateList' : status === 'confirmed' ? 'slangConfirmedList' : 'slangRejectedList';
    const box = document.getElementById(containerId);
    if (!box) return;
    const list = slangEntriesCache.filter(e => e.status === status);
    const q = getSlangSearch();
    const filtered = q ? list.filter(e => slangSearchFields(e).includes(q)) : list;
    if (!filtered.length) {
      box.innerHTML = '<div class="empty-tip" style="padding:10px 12px">' + (list.length ? '没有符合条件的词条' : (status === 'candidate' ? '暂无候选黑话，等 DSH 自动提取、AI 提交或手动添加' : status === 'confirmed' ? '暂无已确认黑话' : '暂无已拒绝词条')) + '</div>';
      updateSlangSelectAll(status);
      return;
    }
    const limit = getSlangLimit();
    const shown = filtered.slice(0, limit);
    let html = '<div class="meta" style="padding:8px 12px">共 ' + filtered.length + ' 条，显示 ' + shown.length + ' 条（可滚动查找）</div>';
    html += '<table class="tbl tbl-wide"><tr><th>选择</th><th>词条</th><th>次数</th><th>来源</th><th>含义 / 用法 / 示例</th><th>参考来源</th><th>语境证据</th><th>操作</th></tr>';
    for (const e of shown) {
      const meaning = e.meaning ? esc(e.meaning) : (status === 'candidate' ? '<span class="meta">待研究</span>' : '<span class="meta">无</span>');
      const checked = slangSelected.has(e.id) ? ' checked' : '';
      const actions = [];
      if (status === 'candidate') {
        actions.push('<button class="btn sm" data-slang-confirm="' + esc(e.id) + '">确认</button>');
        actions.push('<button class="btn sm" data-slang-edit="' + esc(e.id) + '">编辑</button>');
        actions.push('<button class="btn sm" data-slang-reject="' + esc(e.id) + '">拒绝</button>');
      } else if (status === 'confirmed') {
        actions.push('<button class="btn sm" data-slang-edit="' + esc(e.id) + '">编辑</button>');
      } else {
        actions.push('<button class="btn sm" data-slang-restore="' + esc(e.id) + '">恢复候选</button>');
      }
      actions.push('<button class="btn sm danger" data-slang-del="' + esc(e.id) + '">删</button>');
      html += '<tr><td><input type="checkbox" data-slang-select="' + esc(e.id) + '"' + checked + '></td>' +
        '<td><b>' + esc(e.content) + '</b><br><span class="' + slangStatusClass(status) + '">' + slangStatusLabel(status) + '</span></td>' +
        '<td>' + esc(e.count) + '</td><td>' + esc(slangSourceLabel(e)) + '</td>' +
        '<td>' + meaning + (e.usage ? '<br><span class="meta">用法：' + esc(e.usage) + '</span>' : '') + (e.example ? '<br><span class="meta">例：' + esc(e.example) + '</span>' : '') + (e.risk ? '<br><span class="meta">风险：' + esc(e.risk) + '</span>' : '') + '</td>' +
        '<td>' + (slangSourcesHtml(e) || '<span class="meta">—</span>') + '</td>' +
        '<td>' + slangEvidenceHtml(e) + '</td>' +
        '<td style="white-space:nowrap">' + actions.join('') + '</td></tr>';
    }
    box.innerHTML = html + '</table>';
    box.querySelectorAll('[data-slang-select]').forEach(cb => cb.addEventListener('change', () => {
      const id = cb.dataset.slangSelect;
      if (cb.checked) slangSelected.add(id); else slangSelected.delete(id);
      updateSlangSelectAll(status);
    }));
    box.querySelectorAll('[data-slang-confirm]').forEach(btn => btn.addEventListener('click', () => openSlangModal(btn.dataset.slangConfirm, 'confirm')));
    box.querySelectorAll('[data-slang-edit]').forEach(btn => btn.addEventListener('click', () => openSlangModal(btn.dataset.slangEdit, 'edit')));
    box.querySelectorAll('[data-slang-reject]').forEach(btn => btn.addEventListener('click', async () => {
      const r2 = await api('/api/slang/' + btn.dataset.slangReject + '/reject', 'POST', {});
      setSlangMsg(r2.ok ? '✅ 已拒绝' : ('❌ ' + (r2.error || '失败')), r2.ok);
      toast(r2.ok ? '已拒绝该词条' : ('❌ ' + esc(r2.error || '失败')), { type: r2.ok ? 'warn' : 'err' });
      refreshSlang();
    }));
    box.querySelectorAll('[data-slang-restore]').forEach(btn => btn.addEventListener('click', async () => {
      const e = slangEntriesCache.find(x => x.id === btn.dataset.slangRestore);
      if (!e) return;
      const r2 = await api('/api/slang/' + e.id, 'PATCH', { status: 'candidate' });
      setSlangMsg(r2.ok ? '✅ 已恢复为候选' : ('❌ ' + (r2.error || '失败')), r2.ok);
      toast(r2.ok ? '已恢复为候选' : ('❌ ' + esc(r2.error || '失败')), { type: r2.ok ? 'ok' : 'err' });
      refreshSlang();
    }));
    box.querySelectorAll('[data-slang-del]').forEach(btn => btn.addEventListener('click', async () => {
      if (!await confirmBox('确定删除该黑话？此操作不可恢复。')) return;
      const r2 = await api('/api/slang/' + btn.dataset.slangDel, 'DELETE', {});
      setSlangMsg(r2.ok ? '✅ 已删除' : ('❌ ' + (r2.error || '失败')), r2.ok);
      toast(r2.ok ? '已删除' : ('❌ ' + esc(r2.error || '失败')), { type: r2.ok ? 'warn' : 'err' });
      slangSelected.delete(btn.dataset.slangDel);
      refreshSlang();
    }));
    updateSlangSelectAll(status);
  }

  async function refreshSlang() {
    try {
      const r = await api('/api/slang');
      slangEntriesCache = r.entries || [];
      renderSlangPanel();

      : '修改后保存；候选不会转正，已确认仍保持已确认。';

  $$('.slang-tab').forEach(btn => btn.addEventListener('click', () => setSlangTab(btn.dataset.slangTab)));
  $('#slangSearchCand').addEventListener('input', renderSlangPanel);

    const r = await api('/api/slang/extract', 'POST', {});
    setSlangMsg(r.ok ? '✅ 已触发提取' : ('❌ ' + (r.error || '失败')), r.ok);
    toast(r.ok ? '已触发提取' : ('❌ ' + esc(r.error || '失败')), { type: r.ok ? 'ok' : 'err' });
  });
  $('#slangResearch').addEventListener('click', async () => {
    const r = await api('/api/slang/research', 'POST', {});
    setSlangMsg(r.ok ? ('✅ 已触发研究 ' + r.count + ' 条') : ('❌ ' + (r.error || '失败')), r.ok);
    toast(r.ok ? ('已触发研究 ' + r.count + ' 条') : ('❌ ' + esc(r.error || '失败')), { type: r.ok ? 'ok' : 'err' });
  });
  function loadSlangConfig() {
    api('/api/slang').then(r => {
      const c = r.config || {};
      $('#slangEnabled').checked = c.enabled !== false;
      $('#slangExtractMin').value = c.extractMinMessages ?? 10;
      $('#slangCooldown').value = c.extractCooldownMs ?? 300000;
      $('#slangThresholds').value = (c.inferenceThresholds || [2, 4, 8]).join(', ');
      $('#slangInjectMax').value = c.injectMax ?? 8;
      $('#slangLearnerPreset').value = c.learnerPreset || 'qq-chat';
      $('#slangWorkspaceTitle').value = c.workspaceTitle || 'QQ 黑话学习';
      $('#slangAutoResearch').checked = c.autoResearch !== false;
    }).catch(() => {});
  }
  $('#slangConfigSave').addEventListener('click', async () => {
    const r = await api('/api/slang/config', 'POST', {
      enabled: $('#slangEnabled').checked,
      extractMinMessages: Number($('#slangExtractMin').value) || 10,
      extractCooldownMs: Number($('#slangCooldown').value) || 300000,
      inferenceThresholds: $('#slangThresholds').value.split(/[,，\s]+/).map(Number).filter(Boolean),
      injectMax: Number($('#slangInjectMax').value) || 8,
      learnerPreset: $('#slangLearnerPreset').value.trim(),
      workspaceTitle: $('#slangWorkspaceTitle').value.trim(),
      autoResearch: $('#slangAutoResearch').checked
    });
    const msg = $('#slangConfigMsg');
    msg.textContent = r.ok ? '✅ 已保存' : ('❌ ' + (r.error || '失败'));
    msg.className = r.ok ? 'meta ok' : 'meta err';
    toast(r.ok ? '黑话参数已保存' : ('❌ ' + esc(r.error || '失败')), { type: r.ok ? 'ok' : 'err' });
    if (r.ok) loadSlangConfig();
  });

  /* ================= 文件/音频发送 ================= */
  async function loadFileSendConfig() {
    try {
      const r = await api('/api/fileSend');
      const fs = r.fileSend || {};
      const g = Number(fs.volumeGain) || 1;
      $('#fsGainSlider').value = g;
      $('#fsGainVal').textContent = g.toFixed(1) + 'x';
    } catch (e) {}
  }
  $('#fsGainSlider')?.addEventListener('input', (e) => {
    $('#fsGainVal').textContent = Number(e.target.value).toFixed(1) + 'x';
  });
  $('#fsGainSave')?.addEventListener('click', async () => {
    const g = Number($('#fsGainSlider').value);
    const msg = $('#fsGainMsg');
    try {
      const r = await api('/api/fileSend', 'POST', { volumeGain: g });
      msg.textContent = r.ok ? ('✅ 已保存 ' + g.toFixed(1) + 'x，语音发送即时生效') : ('❌ ' + (r.error || '保存失败'));
      msg.className = r.ok ? 'meta ok' : 'meta err';
      toast(r.ok ? '音量增益已保存（' + g.toFixed(1) + 'x）' : ('❌ ' + esc(r.error || '失败')), { type: r.ok ? 'ok' : 'err' });
    } catch (e) {
      msg.textContent = '❌ 保存失败：' + e.message;
      msg.className = 'meta err';
    }
  });

  /* ================= 酷狗登录 ================= */
  let kugouQrTimer = null;
  async function loadKugouLogin() {
    try {
      const r = await api('/api/kugou');
      const status = $('#kugouStatus');
      if (!status) return;
      if (r.ok && r.info && r.info.loggedIn) {
        const vip = r.info.isSvip ? 'SVIP 豪华会员' : r.info.isVip ? 'VIP 会员' : '非会员';
        const fallbackNick = '酷狗 ' + (r.info.userId || '');
        const nick = (r.info.nickname && r.info.nickname !== fallbackNick) ? r.info.nickname : ('酷狗用户 ' + (r.info.userId || ''));
        status.innerHTML = '当前已登录：<b>' + esc(nick) + '</b>（' + vip + '）';
        status.className = 'meta ok';
      } else {
        status.textContent = r.configured ? '已配置 Cookie 但未检测到有效登录态（缺少 userid/token）' : '未登录';
        status.className = 'meta';
      }
    } catch (e) {}
  }
  function kugouStopQrPoll() {
    if (kugouQrTimer) { clearInterval(kugouQrTimer); kugouQrTimer = null; }
  }
  $('#kugouQrLogin')?.addEventListener('click', async () => {
    const msg = $('#kugouMsg');
    const wrap = $('#kugouQrWrap');
    const img = $('#kugouQrImg');
    const st = $('#kugouQrStatus');
    msg.textContent = '正在生成二维码…';
    msg.className = 'meta';
    try {
      const r = await api('/api/kugou/qr', 'POST', {});
      if (!r.ok || !r.qrcodeImg) { msg.textContent = '❌ ' + (r.error || '二维码生成失败'); msg.className = 'meta err'; return; }
      img.src = r.qrcodeImg;
      wrap.style.display = 'block';
      st.textContent = '请用酷狗音乐 App 扫码';
      msg.textContent = '';
      kugouStopQrPoll();
      kugouQrTimer = setInterval(() => kugouPollQr(), 2000);
    } catch (e) {
      msg.textContent = '❌ 生成失败：' + e.message;
      msg.className = 'meta err';
    }
  });
  async function kugouPollQr() {
    const st = $('#kugouQrStatus');
    const msg = $('#kugouMsg');
    try {
      const r = await api('/api/kugou/qr/status');
      const s = r.status;
      if (s === 4) {
        kugouStopQrPoll();
        $('#kugouQrWrap').style.display = 'none';
        st.textContent = '登录成功';
        msg.textContent = '✅ 登录成功：' + ((r.info && r.info.nickname) || (r.info && r.info.userId) || '');
        msg.className = 'meta ok';
        toast('酷狗登录成功 🎉');
        loadKugouLogin();
      } else if (s === 2) {
        st.textContent = '已扫码，请在手机上确认登录';
      } else if (s === 0) {
        kugouStopQrPoll();
        st.textContent = '二维码已过期，请重新生成';
        msg.textContent = '二维码已过期，请重新点击「一键扫码登录」';
        msg.className = 'meta err';
      } else {
        st.textContent = '等待扫码…';
      }
    } catch (e) {}
  }
  $('#kugouSave')?.addEventListener('click', async () => {
    const input = $('#kugouCookieInput');
    const msg = $('#kugouMsg');
    const cookie = (input?.value || '').trim();
    if (!cookie) { msg.textContent = '❌ 请先粘贴 Cookie'; msg.className = 'meta err'; return; }
    msg.textContent = '验证中…';
    msg.className = 'meta';
    try {
      const r = await api('/api/kugou', 'POST', { cookie });
      if (r.ok) {
        msg.textContent = '✅ 登录成功：' + ((r.info && r.info.nickname) || (r.info && r.info.userId) || '');
        msg.className = 'meta ok';
        toast('酷狗 Cookie 已保存并验证通过');
        loadKugouLogin();
      } else {
        msg.textContent = '❌ ' + (r.error || '登录失败');
        msg.className = 'meta err';
      }
    } catch (e) {
      msg.textContent = '❌ 保存失败：' + e.message;
      msg.className = 'meta err';
    }
  });
  $('#kugouClear').addEventListener('confirmed', async () => {
    const msg = $('#kugouMsg');
    try {
      kugouStopQrPoll();
      const r = await api('/api/kugou', 'DELETE', {});
      $('#kugouCookieInput').value = '';
      $('#kugouQrWrap').style.display = 'none';
      if (r.ok) { msg.textContent = '✅ 已退出登录'; msg.className = 'meta ok'; toast('酷狗已退出登录', { type: 'warn' }); loadKugouLogin(); }
      else { msg.textContent = '❌ ' + (r.error || '清除失败'); msg.className = 'meta err'; }
    } catch (e) {
      msg.textContent = '❌ 清除失败：' + e.message;
      msg.className = 'meta err';
    }
  });

  /* ================= 控制台令牌 ================= */
  async function changeConsoleToken(generate) {
    const input = $('#consoleTokenInput');
    const msg = $('#consoleTokenMsg');
    const token = generate ? '' : input.value.trim();
    if (!generate && token && token.length < 16) {
      msg.textContent = '❌ 令牌至少需要 16 位';
      msg.className = 'meta err';
      toast('令牌至少需要 16 位', { type: 'err' });
      return;
    }
    const r = await api('/api/console/token', 'POST', { token });
    if (!r.ok) {
      msg.textContent = '❌ ' + (r.error || '修改失败');
      msg.className = 'meta err';
      toast('❌ ' + esc(r.error || '修改失败'), { type: 'err' });
      return;
    }
    localStorage.setItem('consoleToken', r.token);
    input.value = r.token;
    msg.textContent = r.generated ? ('✅ 已生成随机令牌：' + r.token) : '✅ 已保存新令牌';
    msg.className = 'meta ok';
    toast(r.generated ? '已生成随机令牌，本页面已自动切换' : '令牌已更新，本页面已自动切换', { type: 'warn' });
  }
  $('#consoleTokenSave').addEventListener('click', () => changeConsoleToken(false));
  $('#consoleTokenRandom').addEventListener('confirmed', () => changeConsoleToken(true));

  /* ================= 启动 ================= */
  refresh(); refreshRoles(); refreshWhitelist(); refreshSessions(); refreshPending(); refreshPresets();
  loadSocialForm(); loadV2Config(); refreshV2Activity(); loadV2ToolLog(); loadV2SessionOptions();
  refreshSocialStatus(); refreshSlang(); loadSlangConfig(); loadSecurity(); loadFileSendConfig(); loadKugouLogin();
  setInterval(() => {
    if (document.hidden) return; // 后台标签页暂停轮询
    refresh(); refreshSessions(); refreshPending(); refreshSocialStatus(); refreshSlang();
  }, 3000);
})();
</script>
</body>
</html>
