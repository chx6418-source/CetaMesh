<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 桥接控制台 · 令牌登录</title>
<style>
  /* ==========================================================================
     令牌登录页 · 已落地方案：柔光浮雕 Soft Emboss（方案 09）+ 静水浮升转场（涟漪变体 10）
     光影：低对比 neumorph —— 同色系、无描边无玻璃，只有双光源的明暗差；
           卡片前后各有一圈浮雕底纹，输入框内凹、按钮凸起。
     入场：光源角度旋转落定左上 → 卡片浮起并有一道极淡柔光扫过 → 内容依次上浮
           → 输入框「压入回弹」；底纹落定后极缓呼吸。
     转场（点「进入控制台」）：卡片压入水面 → 主页主题的背景色从「右下角」径向铺满整页
           （.morph 层，目标色按 localStorage.consoleTheme 注入）→ 跳转。
           登录页自身的配色不受主题影响；只有这一段渐变会把主题色带进来。
     ========================================================================== */
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    color: #333d5c; background: #e9eefb;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  body::before {                       /* 环境光：左上主光 + 右下冷补光 */
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(70% 50% at 18% 8%, rgba(255,255,255,.85), transparent 66%),
      radial-gradient(60% 46% at 88% 96%, rgba(190, 205, 245, .5), transparent 68%),
      linear-gradient(150deg, #eef2fc, #e6ebfa);
  }
  /* 卡片前后的两圈浮雕底纹 */
  .rings { position: fixed; inset: 0; pointer-events: none; }
  .rings span {
    position: absolute; left: 50%; top: 50%; border-radius: 50%; background: #e9eefb; opacity: 0;
    transform: translate(-50%, -50%) scale(.88);
  }
  .rings span:nth-child(1) { width: 620px; height: 620px; box-shadow: 22px 24px 60px rgba(176,190,230,.75), -22px -24px 60px rgba(255,255,255,.95); }
  .rings span:nth-child(2) { width: 420px; height: 420px; box-shadow: 16px 18px 42px rgba(176,190,230,.6), -16px -18px 42px rgba(255,255,255,.9); }
  body.enter .rings span:nth-child(1) { animation: ringIn 1.4s cubic-bezier(.22,.9,.36,1) both; }
  body.enter .rings span:nth-child(2) { animation: ringIn 1.4s cubic-bezier(.22,.9,.36,1) .14s both; }
  @keyframes ringIn {
    from { opacity: 0; transform: translate(-50%, -50%) scale(.88); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  body.enter .rings { animation: ringBreath 9s cubic-bezier(.22,.9,.36,1) 1.5s infinite alternate; }
  @keyframes ringBreath { from { opacity: 1; } to { opacity: .955; } }

  .card {
    position: relative; z-index: 2; width: min(404px, 92vw); text-align: center;
    padding: 42px 36px 26px;
    border: 0; border-radius: 30px; background: #eef2fc;
    box-shadow: 18px 20px 46px rgba(172, 187, 228, .78), -18px -20px 46px rgba(255, 255, 255, .98);
    opacity: 0;
  }
  body.enter .card { animation: cardIn 1.15s cubic-bezier(.22,.9,.36,1) .18s both; }
  @keyframes cardIn {
    0%   { opacity: 0; transform: translateY(24px) scale(.965);
           box-shadow: -18px -20px 46px rgba(172,187,228,.78), 18px 20px 46px rgba(255,255,255,.98); }
    42%  { opacity: 1;
           box-shadow: -6px -8px 30px rgba(172,187,228,.6), 6px 8px 26px rgba(255,255,255,.95); }
    100% { opacity: 1; transform: none;
           box-shadow: 18px 20px 46px rgba(172,187,228,.78), -18px -20px 46px rgba(255, 255, 255, .98); }
  }
  .card::after {                       /* 掠过卡片表面的极淡柔光 */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(118deg, transparent 34%, rgba(255,255,255,.5) 50%, transparent 66%);
    opacity: 0;
  }
  body.enter .card::after { animation: sheen 1.5s cubic-bezier(.22,.9,.36,1) .5s both; }
  @keyframes sheen { 0% { opacity: 0; transform: translateX(-14%); } 40% { opacity: .75; } 100% { opacity: 0; transform: translateX(14%); } }

  .logo {
    width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 19px;
    background: #eef2fc; color: #6a7bb8;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800;
    box-shadow: 8px 9px 20px rgba(172,187,228,.85), -8px -9px 20px rgba(255,255,255,1), inset 0 0 0 1px rgba(255,255,255,.5);
  }
  h1 { font-size: 21.5px; letter-spacing: .3px; color: #4a5578; }
  .ver {
    display: inline-block; vertical-align: 3px; margin-left: 7px;
    font-size: 11px; font-weight: 700; color: #6a7bb8;
    background: rgba(120, 145, 235, .12); border-radius: 999px; padding: 2px 9px;
  }
  .sub { margin: 7px 0 24px; font-size: 12.5px; color: #4a5578; }
  .field { position: relative; margin-bottom: 14px; }
  .field .key {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: #93a0c4; pointer-events: none; display: flex;
  }
  input {
    width: 100%; font: inherit; font-size: 14px; color: #4a5578;
    padding: 12.5px 42px 12.5px 38px; border-radius: 16px; outline: none; border: 0;
    background: #e9eefb;
    box-shadow: inset 7px 8px 18px rgba(176, 190, 230, .8), inset -7px -8px 18px rgba(255,255,255,1);
    transition: box-shadow .18s ease;
  }
  input::placeholder { color: #93a0c4; }
  input:focus { box-shadow: inset 5px 6px 16px rgba(176,190,230,.75), inset -5px -6px 16px rgba(255,255,255,1), 0 0 0 3px rgba(120, 145, 235, .22); }
  .eye {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; cursor: pointer; color: #93a0c4;
    padding: 6px; border-radius: 8px; display: flex;
  }
  .eye:hover { color: #6a7bb8; }
  .go {
    width: 100%; font: inherit; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
    padding: 13px; border: 0; border-radius: 16px;
    background: linear-gradient(140deg, #7f97f5, #8fd0f0);
    box-shadow: 10px 12px 26px rgba(150, 170, 230, .7), -8px -9px 22px rgba(255,255,255,.95),
                inset 0 1.5px 0 rgba(255,255,255,.5), inset 0 -2px 6px rgba(70, 110, 210, .18);
    transition: filter .15s, box-shadow .18s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .go:hover { filter: brightness(1.04); }
  .go:active { box-shadow: inset 6px 7px 16px rgba(60, 90, 200, .35), inset -4px -5px 12px rgba(255,255,255,.35); }
  .err { min-height: 17px; margin-top: 9px; font-size: 12px; color: #d95f85; }
  .foot { margin-top: 14px; font-size: 11.5px; color: #93a0c4; }

  /* 内容依次上浮（收在 1.4s 内）；输入框多一个「压入回弹」 */
  .logo, .field, .go, .err, .foot { opacity: 0; }
  body.enter .logo { animation: rise .62s cubic-bezier(.22,.9,.36,1) .60s both; }
  body.enter .field { animation: rise .66s cubic-bezier(.22,.9,.36,1) .68s both; }
  body.enter .field input { animation: press .78s cubic-bezier(.22,.9,.36,1) .68s both; }
  body.enter .go { animation: rise .66s cubic-bezier(.22,.9,.36,1) .76s both; }
  body.enter .foot { animation: rise .7s cubic-bezier(.22,.9,.36,1) .84s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes press {
    0%   { transform: scale(.994); box-shadow: inset 10px 11px 22px rgba(172,187,228,.9), inset -9px -10px 22px rgba(255,255,255,1); }
    60%  { transform: scale(1.001); }
    100% { transform: none; box-shadow: inset 7px 8px 18px rgba(176, 190, 230, .8), inset -7px -8px 18px rgba(255,255,255,1); }
  }

  /* ── 转场（涟漪变体 10 · 静水浮升）：卡片压入水面 + 主题背景色自右下角渐变铺满 ──
     软边圆的「圆心」落在视口右下角，再从 scale(0) 向外扩散；旧实现把圆的包围盒右下角
     放在这里，圆心会一边向左上移动一边放大，最终反而在右下留下透明区，深色主题跳页时
     就会从浅色斜面硬切到深色页面。
     圆本体仍为 240vmax（不增加合成层尺寸），终态放大到 1.35 倍；此时 90% 的纯色半径
     为 145.8vmax，大于任意视口的最长对角线（不超过 141.5vmax），因此跳页前整屏一定
     已经落到目标色。目标色 --morph-bg 仍按 localStorage.consoleTheme 注入，登录页自身
     配色不受影响。 */
  .morph {
    position: fixed; right: -120vmax; bottom: -120vmax; width: 240vmax; height: 240vmax;
    z-index: 3; pointer-events: none; border-radius: 50%;
    background: radial-gradient(closest-side, var(--morph-bg, #eef2fc) 0 90%, transparent 100%);
    transform: scale(0); transform-origin: 50% 50%;
    will-change: transform;
  }
  body.leaving .morph { animation: morphSpread .84s cubic-bezier(.45, 0, .55, 1) both; }
  @keyframes morphSpread { from { transform: scale(0); } to { transform: scale(1.35); } }
  body.leaving .card { animation: sink .8s cubic-bezier(.35, 0, .5, 1) both; }
  @keyframes sink {
    0%   { opacity: 1; transform: none;
           box-shadow: 18px 20px 46px rgba(172,187,228,.78), -18px -20px 46px rgba(255,255,255,.98); }
    26%  { transform: scale(.974);
           box-shadow: inset 10px 12px 26px rgba(176,190,230,.85), inset -10px -12px 26px rgba(255,255,255,1); }
    100% { opacity: 0; transform: scale(.94) translateY(12px);
           box-shadow: 6px 8px 20px rgba(172,187,228,.3), -6px -6px 20px rgba(255,255,255,.6); }
  }
  body.leaving .rings { animation: ringsOut .8s cubic-bezier(.22,.9,.36,1) .06s both; }
  @keyframes ringsOut { to { opacity: 0; } }
  body.leaving::before { animation: ambientOut .62s cubic-bezier(.42, 0, .32, 1) both; }
  @keyframes ambientOut { to { opacity: .25; } }
</style>
</head>
<body>
  <div class="rings" aria-hidden="true"><span></span><span></span></div>
  <div class="card">
    <div class="logo">Q</div>
    <h1>QQ 桥接控制台<span class="ver">Soda UI</span></h1>
    <div class="sub">DeepSeek Harness × SnowLuma · 安全登录</div>
    <div class="field">
      <span class="key"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></span>
      <input id="t" type="password" placeholder="输入控制台访问令牌" autocomplete="current-password" autofocus>
      <button class="eye" id="eye" title="显示/隐藏令牌" type="button">
        <svg id="eyeOpen" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
        <svg id="eyeShut" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M2 12s3.5-6.5 10-6.5c1.3 0 2.5.2 3.6.6M22 12s-3.5 6.5-10 6.5c-1.3 0-2.5-.2-3.6-.6M4 20 20 4"/></svg>
      </button>
    </div>
    <button class="go" id="go">进入控制台
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13m-5-6 6 6-6 6"/></svg>
    </button>
    <div class="err" id="err"></div>
    <div class="foot">© 2026 QQ Bridge · DeepSeek Harness × SnowLuma</div>
  </div>
  <div class="morph" aria-hidden="true"></div>
<script>
  var inp = document.getElementById('t');
  var body = document.body;

  /* 目标色：主页主题的背景色（控制台 :root[data-theme=*] 的 --bg）。
     登录页自身配色保持不变，只有这段转场渐变会把主题色带进来。 */
  var THEME_BG = { light: '#eef2fc', dark: '#131a2e', warm: '#eaede0' };
  var morphBg = THEME_BG.light;
  try { morphBg = THEME_BG[localStorage.getItem('consoleTheme')] || morphBg; } catch (e) {}
  document.documentElement.style.setProperty('--morph-bg', morphBg);

  // 入场动画：先渲染初始态，下一帧加 enter 触发（避免首帧闪一下落定态）
  requestAnimationFrame(function () { body.classList.add('enter'); });

  document.getElementById('eye').addEventListener('click', function () {
    var show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    document.getElementById('eyeOpen').style.display = show ? 'none' : '';
    document.getElementById('eyeShut').style.display = show ? '' : 'none';
    inp.focus();
  });

  var leaving = false;
  function go() {
    var v = inp.value.trim();
    if (!v) { document.getElementById('err').textContent = '请输入控制台访问令牌'; inp.focus(); return; }
    if (leaving) return;
    leaving = true;
    // 让控制台知道「这是从登录页进来的」：它会给各卡片做一次依次浮升的落场动画
    try { sessionStorage.setItem('loginArrive', '1'); } catch (e) {}
    body.classList.remove('enter');       // 先停掉入场动画的 fill，避免与退场动画抢同一属性
    var morph = document.querySelector('.morph');
    var navigated = false;
    var fallbackTimer = null;
    function navigate() {
      if (navigated) return;
      navigated = true;
      if (fallbackTimer) clearTimeout(fallbackTimer);
      location.href = '/?token=' + encodeURIComponent(v);
    }
    // 不再用一个与 CSS 恰好相等的定时器抢最后一帧：等扩散真正结束，再保留 120ms
    // 完整目标色静帧后跳页。后台标签页收不到 animationend 时仍有兜底，不会卡在登录页。
    if (morph) {
      morph.addEventListener('animationend', function (e) {
        if (e.animationName !== 'morphSpread') return;
        setTimeout(navigate, 120);
      }, { once: true });
    }
    body.classList.add('leaving');
    fallbackTimer = setTimeout(navigate, 1100);
  }
  document.getElementById('go').addEventListener('click', go);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  inp.focus();
</script>
</body>
</html>
