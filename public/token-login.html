<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 桥接控制台 · 令牌登录</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #d5e3ff 0%, #ded7ff 48%, #ccf1ef 100%);
    background-attachment: fixed; color: #333d5c;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(60vw 42vh at 18% 0%, rgba(255, 255, 255, .7), transparent 60%),
      radial-gradient(52vw 38vh at 92% 100%, rgba(204, 241, 239, .55), transparent 62%),
      radial-gradient(40vw 30vh at 85% 8%, rgba(222, 215, 255, .45), transparent 60%);
  }
  .card {
    position: relative; width: min(400px, 92vw); text-align: center;
    background: rgba(255, 255, 255, .88); border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 24px; padding: 42px 36px 28px;
    box-shadow: 0 24px 70px rgba(110, 130, 230, .28), -10px -12px 32px rgba(255, 255, 255, .65), inset 0 1.5px 0 rgba(255, 255, 255, .9);
    backdrop-filter: blur(18px) saturate(1.4);
    animation: pop .35s cubic-bezier(.3, 1.4, .5, 1);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  .logo {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 18px;
    background: linear-gradient(140deg, #5b7cfa, #7cc7f2); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800;
    box-shadow: 0 10px 24px rgba(110, 130, 230, .45), inset 0 2px 0 rgba(255, 255, 255, .4);
  }
  h1 { font-size: 22px; letter-spacing: .3px; }
  .ver {
    display: inline-block; vertical-align: 3px; margin-left: 7px;
    font-size: 11px; font-weight: 700; color: #5b7cfa;
    background: rgba(91, 124, 250, .12); border-radius: 999px; padding: 2px 9px;
  }
  .sub { margin: 6px 0 26px; font-size: 12.5px; color: #5a6482; }
  .field { position: relative; margin-bottom: 14px; }
  .field .key {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: #8e97b3; pointer-events: none; display: flex;
  }
  input {
    width: 100%; font: inherit; font-size: 14px; color: #333d5c;
    padding: 12px 42px 12px 38px; border-radius: 14px; outline: none;
    border: 1.5px solid rgba(91, 124, 250, .35); background: rgba(255, 255, 255, .85);
    box-shadow: inset 2px 3px 8px rgba(135, 150, 215, .16);
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: #5b7cfa; box-shadow: 0 0 0 3.5px rgba(91, 124, 250, .18), inset 2px 3px 8px rgba(135, 150, 215, .1); }
  .eye {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; cursor: pointer; color: #8e97b3;
    padding: 6px; border-radius: 8px; display: flex;
  }
  .eye:hover { color: #5b7cfa; }
  .go {
    width: 100%; font: inherit; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
    padding: 13px; border: 0; border-radius: 14px;
    background: linear-gradient(140deg, #5b7cfa, #7cc7f2);
    box-shadow: 0 10px 26px rgba(110, 130, 230, .45), inset 0 1.5px 0 rgba(255, 255, 255, .35);
    transition: filter .15s, transform .1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .go:hover { filter: brightness(1.06); }
  .go:active { transform: scale(.985); }
  .err { min-height: 18px; margin-top: 10px; font-size: 12px; color: #d95f85; }
  .foot { margin-top: 16px; font-size: 11.5px; color: #8e97b3; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Q</div>
    <h1>QQ 桥接控制台<span class="ver">Soda UI</span></h1>
    <div class="sub">DeepSeek Harness × SnowLuma · 安全登录</div>
    <div class="field">
      <span class="key"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></span>
      <input id="t" type="password" placeholder="输入控制台访问令牌" autocomplete="current-password" autofocus>
      <button class="eye" id="eye" title="显示/隐藏令牌" type="button">
        <svg id="eyeOpen" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
        <svg id="eyeShut" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M2 12s3.5-6.5 10-6.5c1.3 0 2.5.2 3.6.6M22 12s-3.5 6.5-10 6.5c-1.3 0-2.5-.2-3.6-.6M4 20 20 4"/></svg>
      </button>
    </div>
    <button class="go" id="go">进入控制台
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13m-5-6 6 6-6 6"/></svg>
    </button>
    <div class="err" id="err"></div>
    <div class="foot">© 2026 QQ Bridge · DeepSeek Harness × SnowLuma</div>
  </div>
<script>
  var inp = document.getElementById('t');
  document.getElementById('eye').addEventListener('click', function () {
    var show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    document.getElementById('eyeOpen').style.display = show ? 'none' : '';
    document.getElementById('eyeShut').style.display = show ? '' : 'none';
    inp.focus();
  });
  function go() {
    var v = inp.value.trim();
    if (!v) { document.getElementById('err').textContent = '请输入控制台访问令牌'; inp.focus(); return; }
    location.href = '/?token=' + encodeURIComponent(v);
  }
  document.getElementById('go').addEventListener('click', go);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  inp.focus();
</script>
</body>
</html>
