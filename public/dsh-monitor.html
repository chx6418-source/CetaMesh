<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dsh 监控终端 · WhaleBridge</title>
  <style>
    :root { color-scheme: dark; font-family: Consolas, "Cascadia Mono", "Microsoft YaHei", monospace; background:#0b1020; color:#dce6ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:radial-gradient(circle at 20% 0,#1e2c55,#0b1020 48%); }
    header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid #30416b; background:rgba(10,15,32,.88); }
    h1 { margin:0; font:700 15px/1.3 "Microsoft YaHei", sans-serif; }
    .pill { margin-left:auto; border:1px solid #405687; border-radius:999px; padding:3px 10px; font:12px/1.3 "Microsoft YaHei", sans-serif; color:#9db4e8; }
    .pill.ok { border-color:#2d9e8a; color:#75e0c6; } .pill.warn { border-color:#b58b42; color:#f1c86f; } .pill.err { border-color:#bb5a7c; color:#ff9fbc; }
    pre { margin:0; flex:1; min-height:0; padding:16px; overflow:auto; white-space:pre-wrap; word-break:break-word; font-size:12px; line-height:1.55; }
    footer { padding:8px 16px; border-top:1px solid #30416b; color:#8294bd; font:11px/1.4 "Microsoft YaHei", sans-serif; }
  </style>
</head>
<body>
  <header><span>▣</span><h1>dsh 监控终端（只读）</h1><span id="status" class="pill">连接中…</span></header>
  <pre id="screen">正在连接 dsh 监控日志…\n</pre>
  <footer>此窗口仅展示 dsh 服务状态与日志，不提供命令输入。可从 WhaleBridge 控制台重新打开。</footer>
  <script>
    (() => {
      const screen = document.getElementById('screen');
      const status = document.getElementById('status');
      let source;
      function nearBottom() { return screen.scrollHeight - screen.clientHeight - screen.scrollTop < 48; }
      function render(s) {
        if (!s) return;
        const ready = s.ready === true;
        status.textContent = ready ? '已就绪' : (s.status || '未知');
        status.className = 'pill ' + (ready ? 'ok' : s.status === 'failed' ? 'err' : 'warn');
        const lines = Array.isArray(s.logs) ? s.logs.map((x) => '[' + new Date(x.time).toLocaleTimeString() + '] ' + x.text).join('\n') : '';
        const next = lines ? lines + '\n' : '（暂无 dsh 输出）\n';
        const stick = nearBottom();
        if (screen.textContent !== next) screen.textContent = next;
        if (stick) screen.scrollTop = screen.scrollHeight;
      }
      function connect() {
        if (source) source.close();
        source = new EventSource('/api/services/stream?service=dsh');
        source.onmessage = (event) => { try { const m = JSON.parse(event.data); render(m.snapshot); } catch {} };
        source.onerror = () => { status.textContent = '连接中…'; status.className = 'pill warn'; };
      }
      connect();
      window.addEventListener('beforeunload', () => source && source.close());
    })();
  </script>
</body>
</html>
