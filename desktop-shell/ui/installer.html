<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>安装鲸桥 WhaleBridge</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2fc;
      --text: #333d5c;
      --text-2: #5a6482;
      --text-3: #8e97b3;
      --accent: #5b7cfa;
      --accent-2: #7cc7f2;
      --accent-shadow: rgba(110, 130, 230, .3);
      --border: rgba(90, 110, 180, .14);
      --panel: rgba(255, 255, 255, .72);
      --ok: #2f9e9a;
      --error: #c84f72;
      --font: "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      position: relative;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(360px 280px at 12% 8%, rgba(140, 175, 255, .32), transparent 70%),
        radial-gradient(340px 270px at 95% 82%, rgba(120, 220, 215, .24), transparent 68%),
        linear-gradient(132deg, #eef2fc, #f0effc 52%, #edf8fa);
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .installer {
      width: min(100%, 716px);
      min-height: 440px;
      padding: 28px 34px 24px;
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, .94);
      border-radius: 28px;
      background: rgba(255, 255, 255, .55);
      backdrop-filter: blur(20px) saturate(1.35);
      box-shadow: 16px 20px 48px rgba(135, 150, 215, .28),
        -10px -13px 32px rgba(255, 255, 255, .82),
        inset 0 1.5px 0 rgba(255, 255, 255, .9),
        inset 0 -2px 6px rgba(100, 120, 190, .06);
      animation: settle .42s cubic-bezier(.22, .9, .36, 1) both;
    }
    @keyframes settle { from { opacity: 0; transform: translateY(10px) scale(.99); } }
    .brand-row { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 44px; height: 44px; flex: none;
      display: grid; place-items: center;
      border-radius: 16px; overflow: hidden;
      box-shadow: 5px 7px 16px var(--accent-shadow), -3px -4px 10px rgba(255,255,255,.86);
    }
    .brand-mark img { display: block; width: 44px; height: 44px; }
    .brand-copy { min-width: 0; }
    .brand-copy h1 { margin: 0; font-size: 17px; line-height: 1.25; letter-spacing: .15px; font-weight: 700; }
    .brand-copy p { margin: 3px 0 0; color: var(--text-3); font-size: 11.5px; letter-spacing: .25px; }
    .version {
      margin-left: auto; align-self: flex-start; padding: 5px 10px;
      border: 1px solid rgba(91, 124, 250, .1); border-radius: 999px;
      color: var(--text-2); background: rgba(255, 255, 255, .52);
      font-size: 11px; white-space: nowrap;
    }
    .hero { margin: 31px 0 22px; text-align: center; }
    .hero-icon {
      position: relative; width: 62px; height: 62px; margin: 0 auto 13px;
      display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.9); border-radius: 23px;
      color: var(--accent); background: linear-gradient(145deg, rgba(255,255,255,.9), rgba(217,231,255,.56));
      box-shadow: 7px 9px 20px rgba(135,150,215,.2), -5px -6px 14px rgba(255,255,255,.86), inset 0 1px 0 #fff;
    }
    .hero-icon svg { width: 31px; height: 31px; }
    .hero-icon.app-icon { border: 0; background: transparent; box-shadow: none; }
    .hero-icon.app-icon img { display: block; width: 62px; height: 62px; }
    .hero h2 { margin: 0; font-size: 23px; line-height: 1.35; letter-spacing: .2px; font-weight: 700; }
    .hero h2 .gradient { color: var(--accent); background: linear-gradient(120deg, var(--accent), #57a9d9); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { margin: 7px 0 0; color: var(--text-2); font-size: 13px; }
    .setup-card {
      width: 100%; padding: 19px 20px 18px;
      border: 1px solid rgba(255,255,255,.96); border-radius: 22px;
      background: var(--panel); box-shadow: 8px 10px 25px rgba(135,150,215,.14), -5px -6px 18px rgba(255,255,255,.78), inset 0 1px 0 rgba(255,255,255,.92);
    }
    .field-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
    .field-head label { font-size: 12.5px; font-weight: 650; }
    .field-head span { color: var(--text-3); font-size: 11px; }
    .path-wrap { display: flex; align-items: center; gap: 10px; }
    .path-input {
      display: block; width: 100%; min-width: 0; height: 43px; padding: 0 13px;
      border: 1px solid rgba(90,110,180,.16); border-radius: 13px;
      outline: 0; color: var(--text); background: rgba(255,255,255,.73);
      box-shadow: inset 2px 3px 7px rgba(135,150,215,.08), inset -2px -2px 6px rgba(255,255,255,.76);
      font-size: 12.5px; user-select: text;
      transition: border-color .16s, box-shadow .16s, background .16s;
    }
    .path-input:focus { border-color: rgba(91,124,250,.58); box-shadow: 0 0 0 3px rgba(91,124,250,.11), inset 0 1px 3px rgba(135,150,215,.08); background: #fff; }
    .path-input:disabled { opacity: .62; }
    .path-note { min-height: 17px; margin: 6px 0 0; color: var(--text-3); font-size: 10.5px; }
    .path-note.error { color: var(--error); }
    .status-area { min-height: 41px; padding-top: 14px; display: flex; align-items: center; gap: 9px; color: var(--text-2); font-size: 12px; }
    .status-area[hidden] { display: none; }
    .spinner { width: 15px; height: 15px; flex: none; border: 2px solid rgba(91,124,250,.2); border-top-color: var(--accent); border-radius: 50%; animation: spin .72s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ok); box-shadow: 0 0 0 4px rgba(47,158,154,.1); }
    .error-box { margin-top: 12px; padding: 10px 12px; border-radius: 12px; color: var(--error); background: rgba(217,95,133,.09); border: 1px solid rgba(217,95,133,.13); font-size: 11.5px; line-height: 1.55; overflow-wrap: anywhere; user-select: text; }
    .error-box[hidden] { display: none; }
    .actions { margin-top: auto; padding-top: 19px; display: flex; align-items: center; gap: 10px; }
    .actions-note { margin-right: auto; color: var(--text-3); font-size: 10.5px; }
    .btn {
      min-height: 39px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 0 17px; border: 0; border-radius: 14px; cursor: pointer;
      color: var(--text-2); background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(255,255,255,.62));
      box-shadow: 5px 6px 14px rgba(135,150,215,.19), -4px -5px 11px rgba(255,255,255,.86), inset 0 1px 0 rgba(255,255,255,.95);
      font-size: 12px; font-weight: 600; white-space: nowrap;
      transition: transform .18s cubic-bezier(.3,1.6,.5,1), filter .16s, box-shadow .16s;
    }
    .btn svg { width: 15px; height: 15px; flex: none; }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.035); }
    .btn:active { transform: translateY(1px) scale(.975); box-shadow: inset 3px 4px 9px rgba(135,150,215,.18), inset -3px -3px 8px rgba(255,255,255,.9); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .btn.primary { color: #fff; background: linear-gradient(140deg, var(--accent), var(--accent-2)); box-shadow: 6px 8px 18px var(--accent-shadow), -4px -5px 12px rgba(255,255,255,.82), inset 0 1.5px 0 rgba(255,255,255,.38); }
    .btn.primary:hover { filter: brightness(1.045); }
    .btn:disabled { cursor: wait; opacity: .52; transform: none; filter: none; }
    .state[hidden] { display: none !important; }
    .footer-mark { position: absolute; right: 27px; bottom: 11px; color: rgba(90,100,130,.43); font-size: 9.5px; letter-spacing: .55px; }
    @media (max-width: 620px) {
      body { padding: 12px; }
      .installer { min-height: 0; height: 100%; padding: 21px 20px 23px; border-radius: 23px; }
      .hero { margin: 25px 0 19px; }
      .hero h2 { font-size: 20px; }
      .setup-card { padding: 16px; }
      .actions-note { display: none; }
      .actions { justify-content: flex-end; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="installer" aria-live="polite">
    <header class="brand-row">
      <span class="brand-mark" aria-hidden="true">
        <img src="whalebridge-icon.png" alt="">
      </span>
      <div class="brand-copy">
        <h1>鲸桥 WhaleBridge</h1>
        <p>轻松连接 · 即刻启程</p>
      </div>
      <span class="version">Windows 安装向导</span>
    </header>

    <section class="hero state" id="welcomeState">
      <div class="hero-icon app-icon" aria-hidden="true">
        <img src="whalebridge-icon.png" alt="">
      </div>
      <h2>把连接交给 <span class="gradient">鲸桥</span></h2>
      <p>设置安装位置，一键完成安装。之后即可打开鲸桥开始使用。</p>
    </section>

    <section class="hero state" id="busyState" hidden>
      <div class="hero-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M16 5.5a10.5 10.5 0 1 0 10.5 10.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 5.9 26 6l-.2 6.4" stroke="#7CC7F2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>正在为你准备鲸桥</h2>
      <p>正在复制程序文件并创建快捷方式，请稍候片刻。</p>
    </section>

    <section class="hero state" id="doneState" hidden>
      <div class="hero-icon" aria-hidden="true" style="color:var(--ok);background:linear-gradient(145deg,rgba(255,255,255,.93),rgba(205,245,235,.76))">
        <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="11" stroke="currentColor" stroke-width="2"/><path d="m10.5 16.2 3.6 3.6 7.6-8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>鲸桥已经准备好了</h2>
      <p>安装完成。现在启动应用，开始使用鲸桥。</p>
    </section>

    <section class="setup-card" aria-label="安装设置">
      <div class="field-head">
        <label for="installDir">安装位置</label>
        <span>可以直接使用推荐位置</span>
      </div>
      <div class="path-wrap">
        <input class="path-input" id="installDir" type="text" spellcheck="false" autocomplete="off" aria-describedby="pathNote">
      </div>
      <p class="path-note" id="pathNote">应用文件将安装在此文件夹中；个人数据会保留在你的用户目录。</p>
      <div class="status-area" id="busyStatus" role="status" hidden><span class="spinner" aria-hidden="true"></span><span id="busyMessage">正在安装，请稍候…</span></div>
      <div class="status-area" id="doneStatus" role="status" hidden><span class="status-dot" aria-hidden="true"></span><span>安装成功，可以启动鲸桥了。</span></div>
      <div class="error-box" id="errorMessage" role="alert" hidden></div>
    </section>

    <footer class="actions">
      <span class="actions-note" id="actionNote">安装只需片刻 · 无需额外配置</span>
      <button class="btn" id="closeButton" type="button" hidden>完成</button>
      <button class="btn primary" id="installButton" type="button">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3.5v8m0 0 3.2-3.2M10 11.5 6.8 8.3M4.5 12.5v2.3c0 .9.7 1.7 1.7 1.7h7.6c.9 0 1.7-.7 1.7-1.7v-2.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        立即安装
      </button>
      <button class="btn primary" id="launchButton" type="button" hidden>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.3 4.3 14 10l-6.7 5.7V4.3Z" fill="currentColor"/><path d="M3.5 10h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".75"/></svg>
        启动鲸桥
      </button>
    </footer>
    <span class="footer-mark" aria-hidden="true">WHALEBRIDGE · SODA GUMMY</span>
  </main>

  <script>
    (function () {
      'use strict';
      var input = document.getElementById('installDir');
      var installButton = document.getElementById('installButton');
      var launchButton = document.getElementById('launchButton');
      var closeButton = document.getElementById('closeButton');
      var pathNote = document.getElementById('pathNote');
      var errorBox = document.getElementById('errorMessage');
      var busyStatus = document.getElementById('busyStatus');
      var doneStatus = document.getElementById('doneStatus');
      var busyMessage = document.getElementById('busyMessage');
      var actionNote = document.getElementById('actionNote');
      var installDir = typeof window.WB_INSTALLER_DEFAULT_DIR === 'string' ? window.WB_INSTALLER_DEFAULT_DIR : '';
      var state = 'welcome';
      input.value = installDir;

      function setState(next) {
        state = next;
        document.getElementById('welcomeState').hidden = next !== 'welcome';
        document.getElementById('busyState').hidden = next !== 'busy';
        document.getElementById('doneState').hidden = next !== 'done';
        input.disabled = next === 'busy' || next === 'done';
        installButton.hidden = next !== 'welcome';
        launchButton.hidden = next !== 'done';
        closeButton.hidden = next !== 'done';
        busyStatus.hidden = next !== 'busy';
        doneStatus.hidden = next !== 'done';
        actionNote.hidden = next === 'busy' || next === 'done';
        installButton.disabled = next === 'busy';
      }

      function showError(error) {
        var message = error && (error.message || error.toString()) || '發生未知錯誤。';
        errorBox.textContent = message;
        errorBox.hidden = false;
        pathNote.classList.add('error');
        pathNote.textContent = '安装未完成。请检查路径和权限后重试。';
      }

      function clearError() {
        errorBox.hidden = true;
        errorBox.textContent = '';
        pathNote.classList.remove('error');
        pathNote.textContent = '应用文件将安装在此文件夹中；个人数据会保留在你的用户目录。';
      }

      function invoke(command, args) {
        var api = window.__TAURI__ && window.__TAURI__.core;
        if (!api || typeof api.invoke !== 'function') {
          return Promise.reject(new Error('安装器未能连接到本机安装服务，请关闭窗口后重新启动安装程序。'));
        }
        return api.invoke(command, args);
      }

      installButton.addEventListener('click', async function () {
        if (state !== 'welcome') return;
        clearError();
        var selectedDir = input.value.trim();
        if (!selectedDir) {
          showError(new Error('请填写安装位置。'));
          input.focus();
          return;
        }
        setState('busy');
        busyMessage.textContent = '正在安装，请稍候…';
        try {
          var result = await invoke('installer_install', { installDir: selectedDir });
          if (result && result.ok === false) throw new Error(result.error || '安装失败。');
          installDir = selectedDir;
          setState('done');
        } catch (error) {
          setState('welcome');
          showError(error);
        }
      });

      launchButton.addEventListener('click', async function () {
        if (state !== 'done') return;
        clearError();
        launchButton.disabled = true;
        try {
          await invoke('installer_launch', { installDir: installDir });
        } catch (error) {
          showError(error);
          launchButton.disabled = false;
        }
      });

      closeButton.addEventListener('click', async function () {
        closeButton.disabled = true;
        try { await invoke('installer_close'); }
        catch (error) { closeButton.disabled = false; showError(error); }
      });

      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && state === 'welcome') installButton.click();
      });
    })();
  </script>
</body>
</html>
