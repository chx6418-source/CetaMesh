<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鲸桥 WhaleBridge</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 120% at 50% 0%, #16233a 0%, #0d1420 60%, #080c14 100%);
      color: #e8eefc;
      font: 15px/1.7 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    }
    .card {
      width: min(640px, calc(100vw - 64px)); padding: 36px 40px;
      background: rgba(22, 32, 50, .72); border: 1px solid rgba(120, 170, 255, .18);
      border-radius: 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    }
    .brand-lockup { display: flex; align-items: center; gap: 13px; }
    .app-icon { display: block; width: 48px; height: 48px; flex: none; }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: .02em; }
    .brand { color: #8fb6ff; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
    .state { display: flex; align-items: center; gap: 10px; margin: 22px 0 6px; font-size: 17px; font-weight: 600; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #ffc53d; box-shadow: 0 0 12px currentColor; }
    .state[data-state="ready"] .dot { background: #3ddc97; }
    .state[data-state="restarting"] .dot { background: #ffa53d; }
    .state[data-state="stopped"] .dot,
    .state[data-state="given_up"] .dot { background: #ff6b6b; }
    .spin { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    p { margin: 10px 0 0; color: #b9c6e0; }
    .detail { white-space: pre-wrap; word-break: break-all; color: #ffd6a5; }
    dl { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid rgba(120, 170, 255, .14); font-size: 13px; }
    dt { color: #8ea3c8; }
    dd { margin: 2px 0 10px; word-break: break-all; font-family: Consolas, "Cascadia Mono", monospace; }
    .hint { margin-top: 18px; font-size: 13px; color: #8ea3c8; }
    code { background: rgba(120, 170, 255, .12); padding: 1px 6px; border-radius: 5px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand-lockup">
      <img class="app-icon" src="whalebridge-icon.png" alt="">
      <div><div class="brand">WhaleBridge Desktop</div><h1>鲸桥</h1></div>
    </div>
    <div class="state" id="state"><span class="dot spin" id="dot"></span><span id="summary">正在启动桥接…</span></div>
    <p class="detail" id="detail"></p>
    <dl>
      <dt>控制台端口</dt>
      <dd id="port">—</dd>
      <dt>worker 日志</dt>
      <dd id="log">—</dd>
    </dl>
    <p class="hint">
      桥接异常时可以先看 worker 日志；需要重新拉起时右键托盘图标选「重启桥接」。
      关闭本窗口会隐藏到托盘，托盘菜单里的「退出」才会真正结束程序。
    </p>
  </main>
  <script>
    function render(payload) {
      if (!payload) return;
      window.__WHALEBRIDGE_STATUS__ = payload;
      var state = document.getElementById('state');
      var dot = document.getElementById('dot');
      state.dataset.state = payload.state || 'starting';
      dot.className = payload.state === 'starting' ? 'dot spin' : 'dot';
      document.getElementById('summary').textContent = payload.summary || '';
      document.getElementById('detail').textContent = payload.detail || '';
      document.getElementById('port').textContent = payload.consolePort ? '127.0.0.1:' + payload.consolePort : '—';
      document.getElementById('log').textContent = payload.logFile || '—';
    }
    window.__wbSetStatus = render;
    render(window.__WHALEBRIDGE_STATUS__);
  </script>
</body>
</html>
