[package]
name = "whalebridge-desktop"
version = "1.0.0-rc.2"
description = "CetaMesh Windows desktop shell"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "whalebridge-desktop"
path = "src/native_main.rs"

[build-dependencies]
embed-resource = "=3.0.9"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
base64 = "=0.23.1"
egui-system-fonts = "=0.36.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
raw-window-handle = "=0.6.2"
rfd = "=0.15.4"
serde_json = "=1.0.149"
url = "=2.5.8"
tray-icon = { version = "=0.23.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
tao = "=0.35.2"
wry = { version = "=0.55.1", default-features = false, features = ["os-webview", "protocol"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
